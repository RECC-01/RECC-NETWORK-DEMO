<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>RECC WALLET</title>

<style>
body{
margin:0;
font-family:Arial;
background:#000;
color:#d4af37;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.container{
background:#000;
padding:35px;
border-radius:15px;
width:360px;
text-align:center;
border:1px solid #d4af37;
box-shadow:0 0 20px rgba(212,175,55,0.2);
}

/* HEADER CON LOGO */
.header{
display:flex;
align-items:center;
justify-content:center;
gap:10px;
margin-bottom:10px;
}

.logo{
width:55px;
height:55px;
border-radius:50%;
border:2px solid #d4af37;
}

/* TITULOS */
h1{
color:#d4af37;
font-size:20px;
margin:2px;
}

.sub{
font-size:12px;
color:#aaa;
margin-bottom:15px;
}

/* INPUTS */
input{
width:100%;
padding:12px;
margin:10px 0;
border-radius:8px;
border:1px solid #d4af37;
background:#000;
color:#fff;
outline:none;
}

/* BOTÓN */
button{
width:100%;
padding:12px;
background:#000;
border:1px solid #d4af37;
border-radius:8px;
color:#d4af37;
font-weight:bold;
cursor:pointer;
}

button:hover{
background:#d4af37;
color:#000;
}

/* MENSAJE */
.msg{
margin-top:10px;
font-size:14px;
color:#f87171;
}
</style>
</head>

<body>

<div class="container">

<!-- 🔥 HEADER CON LOGO -->
<div class="header">
<img src="/img/LOGO_RECC.jpg" class="logo">
<div>
<h1>RECC WALLET</h1>
<h1>RECCNETWORK BLOCKCHAIN</h1>
</div>
</div>

<div class="sub">
RECC • RTS • NFTs • WEB3
</div>

<!-- 🔐 LOGIN -->
<input type="text" id="login" placeholder="Correo, Teléfono o ID">
<input type="password" id="respuesta" placeholder="Respuesta de seguridad">

<button onclick="login()">INGRESAR</button>

<div class="msg" id="msg"></div>

</div>

<script>

async function login() {

const loginValue = document.getElementById("login").value.trim();
const respuesta = document.getElementById("respuesta").value.trim();
const msg = document.getElementById("msg");

msg.innerText = "";

// VALIDACIÓN
if (!loginValue || !respuesta) {
msg.innerText = "Completa todos los campos";
return;
}

try {

const res = await fetch("/api/users/login", {
method: "POST",
headers: {
"Content-Type": "application/json"
},
body: JSON.stringify({
login: loginValue,
respuesta_seguridad: respuesta
})
});

// ERRORES HTTP
if (!res.ok) {
let errorText;
try {
const errData = await res.json();
errorText = errData.error || "Error en el servidor";
} catch {
errorText = "Error inesperado";
}
msg.innerText = errorText;
return;
}

const data = await res.json();

if (!data.success) {
msg.innerText = data.error;
return;
}

// GUARDAR SESIÓN
localStorage.setItem("user", JSON.stringify(data.user));

// REDIRIGIR
window.location.href = "dashboard.html";

} catch (err) {
console.error("ERROR REAL:", err);
msg.innerText = "No se pudo conectar con el servidor";
}

}

</script>

</body>
</html>
